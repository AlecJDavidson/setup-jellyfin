# systemd drop-in for jellyfin.service — set the timezone explicitly for the service.
#
# Install:
#   sudo mkdir -p /etc/systemd/system/jellyfin.service.d
#   sudo cp tz.conf /etc/systemd/system/jellyfin.service.d/tz.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart jellyfin
#
# This augments the packaged unit (do not replace it). The host timezone is used by default, so
# this is only needed if you want a specific TZ regardless of the host setting.
[Service]
Environment=TZ=Etc/UTC
